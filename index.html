<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever leveling</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1d1a26;
    --panel-2: #262233;
    --line: #353047;
    --text: #e6e2f0;
    --muted: #9a93ad;
    --accent: #a78bfa;
    --ok: #5fcf8a;
    --warn: #e8b04a;
    --bad: #e06c75;
    --c-spell: #a78bfa;
    --c-grimoire: #d07be0;
    --c-quest: #e8c04a;
    --c-herb: #6fcf7a;
    --c-skin: #c9945c;
    --c-fish_cook: #5ab4e6;
    --c-wand: #e67e6a;
    --c-camp: #e89a4a;
    --c-aid: #f0f0f0;
    --c-talent: #8fd0c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.35 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }

  header {
    flex: none;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 6px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .spacer { flex: 1; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
  .gap { width: 14px; }

  .chip {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #17131f; font-weight: 600; }
  .btn { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  label.toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #levelNow { min-width: 52px; text-align: center; font-weight: 700; color: var(--accent); }

  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; width: 160px; }
  .progress > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .15s; }
  #progressText { color: var(--muted); font-size: 12px; min-width: 70px; }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 26px;
    /* One row pinned to the space left under the header, so the columns scroll
       inside it and their scrollbar sits to the left of the edge tabs. */
    grid-template-rows: minmax(0, 1fr);
    overflow: hidden;
    position: relative;
  }
  .col { overflow-y: auto; padding: 8px 12px 10px; }
  .col + .col { border-left: 1px solid var(--line); }
  main.swap #levelCol { order: 2; border-left: 1px solid var(--line); }
  main.swap #routeCol { order: 1; border-left: 0; }
  .col > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 8px; font-weight: 600;
  }

  /* Locked view: one scroller, each band pairs a zone with the levels it covers. */
  #locked { grid-column: 1 / 3; grid-row: 1; overflow-y: auto; }
  .band { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
  .band > div { padding: 8px 12px 0; }
  .band > div + div { border-left: 1px solid var(--line); }
  .band.head { position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .band.head > div { padding: 6px 12px; }
  .band.head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }

  .group { margin-bottom: 14px; }
  .group > h3 {
    font-size: 14px; margin: 0 0 4px; padding-bottom: 3px;
    border-bottom: 1px solid var(--panel-2);
    display: flex; align-items: baseline; gap: 8px;
  }
  .group > h3 .lvl { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .group > h3 .zone { color: var(--muted); font-weight: 400; }
  .group > h3 .tally { margin-left: auto; color: #b9b2cc; font-weight: 400; font-size: 12px; white-space: nowrap; }
  .group.all-done > h3 .tally { color: var(--ok); }

  .task {
    display: grid;
    grid-template-columns: 18px 40px minmax(0, 1fr);
    gap: 1px 8px;
    align-items: start;
    padding: 4px 6px;
    border-left: 3px solid var(--cat, var(--line));
    border-radius: 2px;
    cursor: pointer;
  }
  /* A row that is only shown (a talent point): nothing to tick. */
  .task.show { cursor: default; }
  .task + .task { margin-top: 2px; }
  .task:hover { background: var(--panel); }
  .task input { margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
  .task .head { display: flex; gap: 6px; align-items: baseline; }
  .task .title { font-weight: 600; min-width: 0; }
  .task .cost { margin-left: auto; padding-left: 8px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Location and note share one muted line, clamped to two; hover shows the rest. */
  .task .note {
    color: var(--muted); font-size: 13px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .task:hover .note, .task:focus-within .note { -webkit-line-clamp: unset; }
  .task .loc { color: #b9b2cc; }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .task.done { opacity: .6; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Priority: plain word. Only the calls that change what you do are loud. */
  .prio { font-size: 11px; letter-spacing: .04em; margin-top: 2px; font-weight: 800; }
  .prio-BUY, .prio-INFO { color: var(--muted); font-weight: 600; }
  .prio-SKIP { color: var(--bad); }
  .prio-GATE { color: var(--warn); }
  .prio-QUEST { color: var(--c-quest); }
  .prio-BUFF { color: var(--c-fish_cook); }
  /* A talent row shows its icon where the priority word goes. */
  .ticon { width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--line); display: block; }

  .conf { font-weight: 800; cursor: help; }
  .conf-inferred { color: var(--warn); }
  .conf-unverified { color: var(--bad); }
  .src { text-decoration: none; opacity: 0; }
  .task:hover .src, .src:focus-visible { opacity: 1; }

  /* Edge tabs: one per reference panel, down the right side. */
  #rail {
    grid-column: 3; grid-row: 1;
    display: flex; flex-direction: column; gap: 4px; padding-top: 8px;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  #rail button {
    writing-mode: vertical-rl;
    background: var(--panel-2); border: 1px solid var(--line); border-right: 0;
    border-radius: 4px 0 0 4px; padding: 10px 3px; margin-left: 2px;
    font-size: 12px; letter-spacing: .05em; cursor: pointer; color: var(--muted);
  }
  #rail button:hover { color: var(--text); }
  #rail button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #17131f; font-weight: 600; }

  #panel {
    position: absolute; top: 0; right: 26px; bottom: 0;
    width: min(380px, calc(100% - 26px));
    overflow-y: auto;
    padding: 10px 12px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 20px rgba(0, 0, 0, .45);
    z-index: 2;
  }
  #panel[hidden] { display: none; }
  #panel h3 { font-size: 13px; margin: 0 0 4px; color: var(--accent); }
  #panel section { margin-bottom: 14px; }
  #panel dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; font-size: 13px; }
  #panel dt { color: var(--text); font-weight: 600; }
  #panel dd { margin: 0; color: var(--muted); }
  #panel ol { margin: 0; padding-left: 18px; font-size: 13px; }
  #panel p { margin: 0 0 4px; font-size: 13px; color: var(--muted); }

  /* Text boxes and pickers in a panel or the character dialog. */
  #panel input[type="text"], #panel textarea, dialog input[type="text"], dialog textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 6px; margin-bottom: 6px; resize: vertical;
  }
  #panel select, dialog select, #charSelect {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; color: var(--text);
  }
  #panel select, dialog select { margin: 0 6px 6px 0; }
  #charSelect { font-weight: 600; max-width: 260px; }
  .builds label { display: flex; gap: 6px; align-items: baseline; padding: 3px 0; cursor: pointer; }
  .builds label.off { opacity: .45; cursor: default; }
  .builds .what { color: var(--muted); font-size: 12px; display: block; }
  .builds h4.continent { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .builds label.zone { border-left: 3px solid var(--zone, transparent); padding-left: 6px; }
  .builds label.zone .zname { color: var(--zone, inherit); }
  .builds label.zone.on .zname { font-weight: 700; }
  .builds .zlv { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; white-space: nowrap; }
  .builds .grow { flex: 1; min-width: 0; }
  .twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 18px; align-items: start; }
  .twocol > * { min-width: 0; }
  .twocol + .fullrow { margin-top: 4px; }
  .builds .none { color: var(--muted); font-size: 12px; padding: 3px 0 3px 9px; }
  .builds .picon { width: 24px; height: 24px; border-radius: 3px; flex: none; align-self: center; background: var(--panel-2); border: 1px solid var(--line); box-sizing: border-box; }
  .builds img.picon { border: 0; }
  @media (max-width: 520px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
  #panel .bad, dialog .bad { color: var(--bad); }
  #panel .note, dialog .note { color: var(--warn); }
  #panel .good, dialog .good { color: var(--ok); }

  /* Character dialog: make a character, or change the current one. */
  dialog {
    width: min(680px, calc(100% - 24px));
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  dialog::backdrop { background: rgba(10, 8, 14, .7); }
  dialog h2 { font-size: 15px; margin: 0 0 8px; color: var(--accent); }
  dialog p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  dialog .row { margin-bottom: 8px; }
  dialog .buttons { margin: 6px 0 0; position: sticky; bottom: -14px; background: var(--panel); padding: 8px 0 6px; border-top: 1px solid var(--line); }
  dialog .btn { padding: 4px 12px; }
  dialog .btn.main { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  dialog h3 { font-size: 13px; margin: 0 0 4px; color: var(--accent); }
  dialog section { margin-bottom: 10px; }
  dialog .steps { color: var(--text); }

  /* Class and race lists: one button each, in the class or faction colour. */
  .pickcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 12px; margin-bottom: 8px; }
  .pick {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--pc);
    border-radius: 4px; padding: 3px 8px; margin-bottom: 3px; color: var(--pc); font-weight: 600;
  }
  .pick:hover:enabled { border-color: var(--pc); }
  .pick[aria-pressed="true"] { background: var(--pc); border-color: var(--pc); color: #17131f; }
  .pick:disabled { opacity: .3; cursor: default; }
  .pick[aria-pressed="true"]:disabled { opacity: 1; }
  .cls-warrior { --pc: #c79c6e; } .cls-paladin { --pc: #f58cba; } .cls-hunter { --pc: #abd473; }
  .cls-rogue { --pc: #fff569; } .cls-priest { --pc: #ffffff; } .cls-shaman { --pc: #0070de; }
  .cls-mage { --pc: #69ccf0; } .cls-warlock { --pc: #9482c9; } .cls-druid { --pc: #ff7d0a; }
  .fac-horde { --pc: #e0554f; } .fac-alliance { --pc: #5a9be6; }

  /* Tour: a ring around one part of the page, the rest dimmed, a card beside it. */
  #tour { position: fixed; inset: 0; z-index: 10; }
  #tour[hidden] { display: none; }
  #tourRing {
    position: fixed; border: 2px solid var(--accent); border-radius: 4px; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(10, 8, 14, .72);
  }
  #tourCard {
    position: fixed; width: min(330px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 12px 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
  }
  #tourCard h2 { font-size: 15px; margin: 0 0 6px; color: var(--accent); }
  #tourCard p { margin: 0 0 8px; font-size: 13px; }
  #tourCard .count { color: var(--muted); font-size: 12px; }
  #tourCard .btn { padding: 4px 12px; }
  #tourCard .btn.main { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .empty, .error { color: var(--muted); padding: 20px; text-align: center; }
  .error { color: var(--bad); text-align: left; white-space: pre-wrap; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; align-content: start; overflow-y: auto; }
    #locked { overflow: visible; }
    .col { overflow: visible; }
    .col + .col, main.swap #levelCol { border-left: 0; border-top: 1px solid var(--line); }
    .band { grid-template-columns: 1fr; }
    .band > div + div { border-left: 0; }
    .band.head { display: none; }
    #locked, #rail { grid-column: 1; grid-row: auto; }
    #rail { flex-direction: row; flex-wrap: wrap; padding: 4px; border-left: 0; order: -1; }
    #rail button { writing-mode: horizontal-tb; border-right: 1px solid var(--line); border-radius: 4px; margin: 0; padding: 2px 8px; }
    /* In the flow, under the tabs, so the tab that opened it can close it. */
    #panel {
      position: static; width: auto; grid-column: 1; order: -1; overflow: visible;
      border-left: 0; border-bottom: 1px solid var(--line); box-shadow: none;
    }
  }
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>WoW Forever</h1>
    <select id="charSelect" aria-label="Character" title="Switch character"></select>
    <button class="btn" id="charEdit" type="button" title="Rename, change or remove this character">Edit</button>
    <button class="btn" id="charNew" type="button" title="Add a character">+ New</button>
    <span class="gap"></span>
    <div class="progress" title="Overall progress"><i id="progressBar"></i></div>
    <span id="progressText"></span>
    <span class="spacer"></span>
    <button class="btn" id="lockBtn" aria-pressed="true" title="Scroll both columns together, levels lined up">Lock scroll</button>
    <button class="btn" id="swapBtn" title="Swap the In zone and On level columns">⇄ Swap</button>
    <button class="btn" id="exportBtn" title="Download progress as a JSON file">Export</button>
    <button class="btn" id="importBtn" title="Load progress from a JSON file">Import</button>
    <button class="btn" id="resetBtn" title="Clear this character's completed tasks">Reset</button>
    <button class="btn" id="tourBtn" type="button" title="Show the short tour of the page again">?</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div class="row">
    <span class="label">Level</span>
    <button class="chip" id="levelAll" type="button">All</button>
    <button class="btn" id="levelDown" type="button" title="Previous level">−</button>
    <span id="levelNow"></span>
    <button class="btn" id="levelUp" type="button" title="Next level">+</button>
    <span class="gap"></span>
    <span class="row" id="categoryRow"><span class="label">Type</span></span>
    <span class="spacer"></span>
    <button class="chip" id="finishedBtn" type="button" aria-pressed="false" title="Levels with every task ticked are hidden until you show them"></button>
    <label class="toggle"><input type="checkbox" id="hideDone"> Hide done tasks</label>
  </div>
</header>

<main id="main">
  <div class="col" id="levelCol"><h2>On level</h2><div id="levels"></div></div>
  <div class="col" id="routeCol"><h2>In zone</h2><div id="route"></div></div>
  <div id="locked" hidden></div>
  <nav id="rail" aria-label="Reference panels"></nav>
  <aside id="panel" hidden></aside>
</main>
<dialog id="charDialog" aria-label="Character"></dialog>
<div id="tour" hidden>
  <div id="tourRing"></div>
  <div id="tourCard" role="dialog" aria-label="Tour of the page"></div>
</div>

<!-- data/index.js lists the data files; the app loads each one in order. -->
<script src="data/index.js"></script>
<script>
(function () {
  "use strict";

  // Saved state. The older key held one character's progress; it is read once
  // when the new key is empty, and left as it was.
  const STORAGE_KEY = "forever-lvl.v2", OLD_STORAGE_KEY = "forever-lvl.v1";
  // Row categories, key -> label. Declared in data/categories.js; the talent
  // category is the page's own, for the rows it makes from a talent build.
  const CATEGORIES = {};
  // What a character can be: data/characters.js.
  const options = () => window.CHARACTER_OPTIONS || {};
  const label = (list, key) => ((options()[list] || []).find((x) => x.key === key) || {}).label || key;
  // The game allows two primary professions and every secondary one.
  const MAX_PRIMARY = 2;
  // Up to this level a character's zones start as its race's usual path;
  // past it the zones are picked by hand, place by place.
  const PATH_MAX_LEVEL = 20;
  const raceByKey = (key) => (options().races || []).find((x) => x.key === key) || {};
  const raceOf = (ch) => raceByKey(ch.race);
  // The game zones a race can tick: its own path first, then every zone of
  // its faction (`faction` in the zone list: alliance, horde or both).
  function zoneChoices(race) {
    const out = (race.path || []).slice();
    for (const z of options().zones || []) {
      if ((z.faction === race.faction || z.faction === "both") && !out.includes(z.name)) out.push(z.name);
    }
    return out;
  }
  // A character's ticked zones; one saved before zones could be ticked has
  // none of its own and follows its race's path.
  const zonesOf = (ch) => ch.zones || raceOf(ch).path || [];
  const racesFor = (cls) => (options().races || []).filter((r) => !cls || !r.classes || r.classes.includes(cls));
  const isPrimary = (x) => x.kind !== "secondary";

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ---- state -------------------------------------------------------------
  // level: "all" or a character level. swap: In zone column on the left
  // (On level is on the left by default).
  // lock: both columns scroll as one, each zone beside the levels it covers.
  // showFinished: keep rows whose tasks are all ticked on screen.
  // panel: id of the open reference panel, or null.
  // characters: every saved character; character: which one is shown. A new
  // visitor has none, and the character dialog stays open until one is made.
  //
  // A character is { name, class, race, professions, zones, places, done,
  // level, builds, build }. name is "" until the user types one. zones are
  // the game zones ticked for levels 1-20 (null: the race's path); places are
  // the hubs ticked past level 20. done, level, builds and build belong
  // to the character and are reached through state as before:
  // builds: talent builds the user pasted in, [{ name, url }]. build: which one
  // is shown, counting the data file's own build (if any) as number 0.
  const state = { characters: [], character: 0, category: "all", hideDone: false, swap: false, lock: true, showFinished: false, panel: null };
  const me = () => state.characters[state.character];
  // What the page reads while there is no character.
  const NOBODY = { done: new Set(), level: "all", builds: [], build: 0 };
  for (const k of ["done", "level", "builds", "build"]) {
    Object.defineProperty(state, k, { get: () => (me() || NOBODY)[k], set: (v) => { if (me()) me()[k] = v; } });
  }
  const raceClass = (c) => label("races", c.race) + " " + label("classes", c.class);
  const charName = (c) => c.name || raceClass(c);

  // Saved or imported text -> a character. Anything unknown or missing comes
  // from `base` when there is one (the character an old save belongs to), or
  // is the first class and race in the lists, with nothing chosen.
  function readCharacter(raw, base) {
    const o = options(), first = base || {};
    const known = (list, key) => (o[list] || []).some((x) => x.key === key);
    return {
      name: typeof raw.name === "string" ? raw.name.slice(0, 40) : "",
      class: known("classes", raw.class) ? raw.class : first.class || ((o.classes || [])[0] || {}).key,
      race: known("races", raw.race) ? raw.race : first.race || ((o.races || [])[0] || {}).key,
      professions: (Array.isArray(raw.professions) ? raw.professions : first.professions || []).filter((x) => known("professions", x)),
      places: (Array.isArray(raw.places) ? raw.places : first.places || []).map(String),
      zones: Array.isArray(raw.zones) ? raw.zones.map(String) : null,
      done: new Set(Array.isArray(raw.done) ? raw.done.map(String) : []),
      level: raw.level === "all" || Number.isInteger(raw.level) ? raw.level : "all",
      builds: (Array.isArray(raw.builds) ? raw.builds : []).filter((b) => b && typeof b.url === "string")
        .map((b) => ({ name: String(b.name || "Build"), url: b.url })),
      build: Number.isInteger(raw.build) && raw.build >= 0 ? raw.build : 0
    };
  }

  function loadState() {
    let raw = null, old = false;
    try {
      raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!raw) { raw = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY) || "null"); old = !!raw; }
    } catch (e) { /* corrupt or unavailable storage: start clean */ }
    applyState(raw || {}, old);
  }
  // Takes both shapes: the current one, with a list of characters, and the
  // older one (`old`, or anything with a `done` list), which is one
  // character's progress from when the page was a single Orc Warlock and
  // becomes that character. Anything else leaves no character.
  function applyState(raw, old) {
    if (typeof raw.category === "string") state.category = raw.category;
    if (typeof raw.panel === "string" || raw.panel === null) state.panel = raw.panel;
    for (const k of ["hideDone", "swap", "lock", "showFinished"]) if (typeof raw[k] === "boolean") state[k] = raw[k];
    const list = Array.isArray(raw.characters) ? raw.characters.filter((c) => c && typeof c === "object") : [];
    state.characters = list.length ? list.map((c) => readCharacter(c))
      : old || Array.isArray(raw.done) ? [readCharacter(raw, options().legacy)] : [];
    state.character = Number.isInteger(raw.character) && raw.character >= 0 && raw.character < state.characters.length ? raw.character : 0;
  }
  function serialize() {
    return Object.assign({}, state, { characters: state.characters.map((c) => Object.assign({}, c, { done: [...c.done] })) });
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize())); } catch (e) { /* ignore */ }
  }

  // ---- data loading ------------------------------------------------------
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Could not load " + src));
      document.head.appendChild(s);
    });
  }
  // "7-8" -> [7, 8]; "10" -> [10, 10]
  function range(levels) {
    const m = String(levels).match(/\d+/g) || [0];
    return [Number(m[0]), Number(m[m.length - 1])];
  }
  // ---- talent builds -----------------------------------------------------
  // A build is a Wowhead Forever talent calculator address, for any class. Its
  // last part is the order the points were clicked in: a tree digit, then one
  // letter per point (the talent's position in its tree, by row then column).
  // An upper-case letter stands for every rank of that talent taken in a row.
  // The part before it holds the final rank of every talent.
  const ORDER_ONE = "abcdefghjkmnpqrstvwzxyilou468-~!";
  const ORDER_ALL = "ABCDEFGHJKMNPQRSTVWZXYILOU579_^.";
  const CLASSES = ["warrior", "paladin", "hunter", "rogue", "priest", "shaman", "mage", "warlock", "druid"];
  const FIRST_TALENT_LEVEL = 10, POINTS_PER_ROW = 5;
  const ICON_URL = "https://wow.zamimg.com/images/wow/icons/medium/", ICON_LOCAL = "icons/";
  const HOW_TO = "On Wowhead's Forever talent calculator, start from an empty tree, click the points in the order you will take them, then copy the address from the browser's address bar.";

  // Text the user pasted -> { slug, ranks, order, url } or { error }.
  function parseAddress(text) {
    const raw = String(text || "").trim();
    if (!raw) return { error: "Paste a Wowhead talent calculator address." };
    let url = null;
    if (!/\s/.test(raw)) {
      try { url = new URL(/^[a-z]+:\/\//i.test(raw) ? raw : "https://" + raw); } catch (e) { /* not an address */ }
    }
    if (!url || !/(^|\.)wowhead\.com$/i.test(url.hostname)) {
      const want = " This page needs the calculator's address, which starts with https://www.wowhead.com/forever/talent-calc/.";
      if (/wowforevertalents\.com/i.test(raw) || /^[a-z]?\d{1,24}(-\d{0,24}){0,2}$/.test(raw)) {
        return { error: "That is a wowforevertalents.com build. It holds the finished build but not the order the points are taken in." + want };
      }
      if (/^v\d[\w-]*$/.test(raw) || /^[0-2][a-zA-Z0-9.!_~^-]+$/.test(raw)) {
        return { error: "That is only part of the address. Paste the whole thing, starting with https://." };
      }
      if (/^[A-Za-z0-9_+\/=-]{20,}$/.test(raw) || /^#?b\//.test(raw) || /^\s*[{[]/.test(raw)) {
        return { error: "That looks like an exported build (the text a game client, addon or another planner produces), not an address. An export has no leveling order in it." + want + " " + HOW_TO };
      }
      return { error: "That is not a calculator address." + want };
    }
    const parts = url.pathname.split("/").filter(Boolean);
    const at = parts.indexOf("talent-calc");
    if (at < 0) return { error: "That is a Wowhead page, but not the talent calculator." };
    if (!parts.slice(0, at).includes("forever")) {
      return { error: "That calculator link is not for WoW Forever (no /forever/ in the address). Other versions of the game have different talent trees." };
    }
    const slug = parts[at + 1], build = parts[at + 2], order = parts[at + 3];
    if (!slug) return { error: "The address has no class in it. " + HOW_TO };
    if (!CLASSES.includes(slug)) return { error: "Unknown class '" + slug + "' in the address." };
    if (!build) return { error: "No talents are picked in that address. " + HOW_TO };
    if (/^v\d[A-Z]/.test(build)) {
      return { error: "That address holds an imported character build, which has no leveling order in it. " + HOW_TO };
    }
    const m = /^v(\d)([\d-]*)(_.*)?$/.exec(build);
    if (!m) return { error: "Cannot read the build part of the address ('" + build + "')." };
    if (m[1] !== "2") return { error: "That address uses Wowhead build format v" + m[1] + "; this page only reads v2, so it would get the talents wrong." };
    if (!order) return { error: "The address has the talents but not the order they were taken in. Opening a finished build does not record an order. " + HOW_TO };
    return { slug, ranks: m[2].split("-"), order, url: url.origin + url.pathname };
  }

  // Tree data for a class, loaded the first time it is needed.
  function loadTrees(slug) {
    const have = () => (window.TALENT_TREES || {})[slug];
    if (have()) return Promise.resolve(have());
    return loadScript("data/talents-" + slug + ".js").then(() => {
      if (!have()) throw new Error("no trees in the file");
      return have();
    });
  }

  // -> { errors, notes, points: [{ tree, index }] }. Errors mean the build
  // cannot be used; notes are worth showing but do not stop it.
  function decodeOrder(parsed, cls) {
    const errors = [], notes = [], points = [];
    let tree = 0;
    for (const ch of parsed.order) {
      const talents = (cls.trees[tree] || {}).talents || [];
      const one = ORDER_ONE.indexOf(ch), all = ORDER_ALL.indexOf(ch);
      if (/[0-9]/.test(ch) && Number(ch) < cls.trees.length) tree = Number(ch);
      else if (one >= 0 && talents[one]) points.push({ tree, index: one });
      else if (all >= 0 && talents[all]) for (let i = 0; i < talents[all].max; i++) points.push({ tree, index: all });
      else { errors.push("Cannot read '" + ch + "' in the order part of the address. Was it cut short or edited?"); break; }
    }
    if (errors.length) return { errors, notes, points };

    // The order must add up to the final ranks in the same address.
    const count = cls.trees.map((t) => t.talents.map(() => 0));
    points.forEach((p) => count[p.tree][p.index]++);
    cls.trees.forEach((t, ti) => t.talents.forEach((x, xi) => {
      const final = Number((parsed.ranks[ti] || "")[xi] || 0);
      if (count[ti][xi] !== final) errors.push(x.name + ": " + count[ti][xi] + " points in the order, " + final + " in the build.");
    }));
    if (errors.length) {
      errors.unshift("The order and the build in this address do not match, so part of it was not clicked in order or the address was edited.");
      return { errors: errors.slice(0, 4), notes, points };
    }

    // Rules the calculator enforces; a break means a hand-edited address.
    const spent = cls.trees.map(() => 0), have = cls.trees.map((t) => t.talents.map(() => 0));
    points.forEach((p, k) => {
      const t = cls.trees[p.tree].talents[p.index], level = FIRST_TALENT_LEVEL + k;
      if (spent[p.tree] < t.row * POINTS_PER_ROW) notes.push("Level " + level + ": " + t.name + " is taken before its row is open.");
      for (const r of t.requires || []) {
        const need = cls.trees[p.tree].talents[r];
        if (need && have[p.tree][r] < need.max) notes.push("Level " + level + ": " + t.name + " is taken before " + need.name + " is maxed.");
      }
      spent[p.tree]++; have[p.tree][p.index]++;
    });
    return { errors, notes: notes.slice(0, 4), points };
  }

  // Pasted text -> { error } or { slug, cls, points, notes, url, summary }.
  // Answers are kept, so asking again for the same text is free.
  const buildCache = new Map();
  function readBuild(text) {
    const key = String(text || "").trim();
    if (!buildCache.has(key)) buildCache.set(key, (async () => {
      const parsed = parseAddress(key);
      if (parsed.error) return parsed;
      let cls;
      try { cls = await loadTrees(parsed.slug); }
      catch (e) { return { error: "This page has no talent data for " + parsed.slug + " yet." }; }
      const d = decodeOrder(parsed, cls);
      if (d.errors.length) return { error: d.errors.join(" ") };
      if (!d.points.length) return { error: "No talents are picked in that address. " + HOW_TO };
      const per = cls.trees.map((t, ti) => t.name + " " + d.points.filter((p) => p.tree === ti).length)
        .filter((x) => !/ 0$/.test(x)).join(" / ");
      const last = FIRST_TALENT_LEVEL + d.points.length - 1;
      return {
        slug: parsed.slug, cls, points: d.points, notes: d.notes, url: parsed.url,
        summary: (cls.name || parsed.slug) + ": " + per + " (levels " + FIRST_TALENT_LEVEL + "-" + last + ")"
      };
    })());
    return buildCache.get(key);
  }

  // The data file's own build when it is for this character's class, then the
  // pasted ones.
  function buildList() {
    const own = window.TALENT_DATA && window.TALENT_DATA.build;
    const mine = own && me() && parseAddress(own).slug === me().class;
    return (mine ? [{ name: "Example build", url: own, fixed: true }] : []).concat(state.builds);
  }

  // One task per talent point, on the level it is taken. Ids go by level.
  function talentTasks(build, maxLevel) {
    const taken = new Map(), out = [];
    build.points.forEach((p, k) => {
      const level = FIRST_TALENT_LEVEL + k;
      const tree = build.cls.trees[p.tree], t = tree.talents[p.index];
      const key = p.tree + ":" + p.index;
      const rank = (taken.get(key) || 0) + 1;
      taken.set(key, rank);
      if (level > maxLevel) return;
      out.push({ level, task: {
        id: "tal_" + level, category: "talent", priority: "TALENT", icon: t.icon,
        title: t.name + " " + rank + "/" + t.max, location: tree.name, note: t.ranks[rank - 1],
        source: build.url, confidence: "confirmed"
      } });
    });
    return out;
  }

  // Rebuild the On level groups from the hand-written rows plus the active
  // build. Talent rows stop at the last level the loaded data covers.
  let BASE_LEVELS = [], ACTIVE = null;
  async function applyBuild() {
    const list = buildList();
    state.build = Math.max(0, Math.min(state.build, list.length - 1));
    await Promise.all(list.map((b) => readBuild(b.url)));
    ACTIVE = list.length ? await readBuild(list[state.build].url) : null;
    LEVELS = BASE_LEVELS.map((g) => Object.assign({}, g, { tasks: g.tasks.slice() }));
    if (ACTIVE && !ACTIVE.error) {
      for (const { level, task } of talentTasks(ACTIVE, MAX_LEVEL)) {
        let g = LEVELS.find((x) => x.level === level);
        if (!g) LEVELS.push(g = { level, tasks: [] });
        g.tasks.unshift(task);
      }
    } else if (ACTIVE) {
      console.warn("Talent build '" + list[state.build].name + "': " + ACTIVE.error);
    }
    LEVELS.sort((a, b) => a.level - b.level);
    ALL = ROUTE.concat(LEVELS).flatMap((g) => g.tasks || []);
  }

  // A row with a `trainer` and no location gets the trainer's location for
  // this character's race at that level, when the trainer list has one.
  function withTrainer(t, level, ch) {
    if (t.location || !t.trainer) return t;
    const found = (window.TRAINERS || []).find((x) =>
      x.teaches === t.trainer && x.race === ch.race && level >= range(x.levels)[0] && level <= range(x.levels)[1]);
    return found ? Object.assign({}, t, { location: found.location }) : t;
  }

  // A rank row (`learn`) gets the trainers who teach that rank to this
  // character's faction: those in its ticked zones first, then the ones in
  // its faction's capital cities. A trainer teaches a rank when the skill
  // range of its section of the trainer page reaches the rank's top skill.
  function withProfessionTrainers(t, ch) {
    if (!t.learn) return t;
    const race = raceOf(ch);
    const capitals = ((options().factions || []).find((f) => f.key === race.faction) || {}).capitals || [];
    const places = (window.ROUTE_DATA || []).filter((z) => ch.places.includes(z.place)).map((z) => z.area);
    const zones = zonesOf(ch).concat(places);
    const all = (window.PROF_TRAINERS || []).filter((x) => x.profession === t.learn.profession &&
      x.lo < t.learn.max && t.learn.max <= x.hi && (x.faction === "both" || x.faction === race.faction));
    const say = (x) => [x.name, x.town, x.zone].filter(Boolean).join(", ");
    const near = all.filter((x) => zones.includes(x.zone)), city = all.filter((x) => capitals.includes(x.zone) && !near.includes(x));
    const location = near.length || city.length ? near.concat(city).map(say).join("; ")
      : all.length ? "None in your zones or capital cities. Listed: " + all.map(say).join("; ")
        : "No trainer listed for your faction";
    return Object.assign({}, t, { location });
  }

  // Does a row apply to this character? A row can name classes, races and
  // professions; for professions, having any one of them is enough.
  function applies(t, ch) {
    return (!t.classes || t.classes.includes(ch.class)) &&
      (!t.races || t.races.includes(ch.race)) &&
      (!t.professions || t.professions.some((p) => ch.professions.includes(p)));
  }
  // Every place in the data, in level order, with only this character's rows.
  function placesFor(ch) {
    return (window.ROUTE_DATA || []).slice().sort((a, b) => range(a.levels)[0] - range(b.levels)[0])
      .map((z) => Object.assign({}, z, { tasks: (z.tasks || []).filter((t) => applies(t, ch)) }));
  }

  // Is a place on this character's way? Up to PATH_MAX_LEVEL that is decided
  // by its ticked game zones (the race's path to start with); later places
  // are ticked by hand.
  const onPath = (z) => range(z.levels)[0] <= PATH_MAX_LEVEL;
  const visits = (z, ch) => (onPath(z) ? zonesOf(ch).includes(z.area) : ch.places.includes(z.place));

  // Pick the rows for the current character, then add its talent build.
  // In zone shows the places the character chose that have rows for it.
  async function applyCharacter() {
    const ch = me();
    if (!ch) { ROUTE = []; BASE_LEVELS = []; LEVELS = []; ALL = []; ACTIVE = null; return; }
    ROUTE = placesFor(ch).filter((z) => z.tasks.length && (!z.place || visits(z, ch)));
    // Several files can hold rows for one level (a class, a profession): one
    // group per level, rows by `order` (default 50) and then by load order.
    const byLevel = new Map();
    for (const g of window.LEVEL_DATA || []) {
      if (g.class && g.class !== ch.class) continue;
      for (const t of g.tasks || []) {
        if (!applies(t, ch)) continue;
        if (!byLevel.has(g.level)) byLevel.set(g.level, []);
        byLevel.get(g.level).push(withProfessionTrainers(withTrainer(t, g.level, ch), ch));
      }
    }
    const order = (t) => (t.order == null ? 50 : t.order);
    BASE_LEVELS = [...byLevel].map(([level, tasks]) => ({ level, tasks: tasks.sort((a, b) => order(a) - order(b)) }));
    if (state.level !== "all") state.level = Math.min(MAX_LEVEL, Math.max(1, state.level));
    await applyBuild();
  }

  async function loadData() {
    for (const f of window.DATA_FILES || []) await loadScript("data/" + f);
    for (const c of window.CATEGORY_DATA || []) {
      CATEGORIES[c.key] = c.label;
      document.documentElement.style.setProperty("--c-" + c.key, c.color);
    }
    CATEGORIES.talent = "Talent";
    // The last level any character's data covers; talent rows stop there.
    const every = (window.ROUTE_DATA || []).concat(window.LEVEL_DATA || []);
    MAX_LEVEL = Math.max(1, ...(window.ROUTE_DATA || []).map((z) => range(z.levels)[1]), ...(window.LEVEL_DATA || []).map((g) => g.level));

    const seen = new Set(), problems = [];
    for (const t of every.flatMap((g) => g.tasks || [])) {
      if (!t.id) problems.push("Task without id: " + t.title);
      else if (seen.has(t.id)) problems.push("Duplicate task id: " + t.id);
      seen.add(t.id);
      if (!CATEGORIES[t.category]) problems.push("Unknown category '" + t.category + "' on " + t.id);
    }
    if (problems.length) console.warn("Data problems:\n" + problems.join("\n"));
  }

  // ---- rendering ---------------------------------------------------------
  let ROUTE = [], LEVELS = [], ALL = [], MAX_LEVEL = 1;

  function renderFilters() {
    const on = state.level !== "all";
    $("levelAll").setAttribute("aria-pressed", String(!on));
    $("levelNow").textContent = on ? "Lv " + state.level : "—";
    $("levelDown").disabled = on && state.level <= 1;
    $("levelUp").disabled = on && state.level >= MAX_LEVEL;

    const cRow = $("categoryRow");
    cRow.querySelectorAll(".chip").forEach((n) => n.remove());
    const used = new Set(ALL.map((t) => t.category));
    const add = (key, label) => {
      const b = el("button", "chip", label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.category === key));
      if (key !== "all") b.style.borderLeft = "3px solid var(--c-" + key + ")";
      b.addEventListener("click", () => set("category", key));
      cRow.appendChild(b);
    };
    add("all", "All");
    for (const key of Object.keys(CATEGORIES)) if (used.has(key)) add(key, CATEGORIES[key]);

    $("hideDone").checked = state.hideDone;
    $("main").classList.toggle("swap", state.swap);
    $("lockBtn").setAttribute("aria-pressed", String(state.lock));
    $("routeCol").hidden = $("levelCol").hidden = state.lock;
    $("locked").hidden = !state.lock;
  }

  function renderTask(t) {
    const done = isDone(t);
    const cat = CATEGORIES[t.category] || t.category;
    const row = el(shownOnly(t) ? "div" : "label", "task" + (done ? " done" : "") + (shownOnly(t) ? " show" : ""));
    row.style.setProperty("--cat", "var(--c-" + t.category + ")");
    row.title = cat;

    if (shownOnly(t)) {
      // Keeps the checkbox column, so the icon lines up with the rows around it.
      row.appendChild(el("span"));
    } else {
      const box = el("input");
      box.type = "checkbox";
      box.checked = done;
      box.addEventListener("change", () => toggle(t.id, box.checked));
      row.appendChild(box);
    }

    if (t.icon) {
      // Wowhead's copy first, then the one in icons/, then the plain word.
      const img = el("img", "ticon");
      img.alt = "";
      img.onerror = () => {
        if (!img.dataset.local) { img.dataset.local = "1"; img.src = ICON_LOCAL + t.icon + ".jpg"; }
        else img.replaceWith(el("span", "prio prio-INFO", t.priority));
      };
      img.src = ICON_URL + t.icon + ".jpg";
      row.appendChild(img);
    } else {
      row.appendChild(el("span", "prio prio-" + t.priority, t.priority));
    }

    const body = el("div");
    const head = el("div", "head");
    head.appendChild(el("span", "sr", cat + ": "));
    head.appendChild(el("span", "title", t.title));
    if (t.confidence && t.confidence !== "confirmed") {
      const inferred = t.confidence === "inferred";
      const c = el("span", "conf conf-" + t.confidence, inferred ? "~" : "?");
      c.title = inferred
        ? "From Classic data; not confirmed for Forever"
        : "No source found; check in-game";
      c.setAttribute("aria-label", c.title);
      head.appendChild(c);
    }
    // Routine costs stay in the data but off screen; set showCost on a task
    // whose price is worth planning for (a mount, say).
    if (t.cost && t.showCost) head.appendChild(el("span", "cost", t.cost));
    // `source` is a list, so a row can cite both sides of a conflict.
    [].concat(t.source || []).forEach((url, i, all) => {
      const a = el("a", "src", "\u2197");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = all.length > 1 ? "Open source " + (i + 1) + " of " + all.length : "Open source";
      a.setAttribute("aria-label", "Source" + (all.length > 1 ? " " + (i + 1) : "") + " for " + t.title);
      if (i === 0 && !(t.cost && t.showCost)) a.style.marginLeft = "auto";
      a.addEventListener("click", (e) => e.stopPropagation());
      head.appendChild(a);
    });
    body.appendChild(head);

    if (t.location || t.note) {
      const note = el("div", "note");
      if (t.location) note.appendChild(el("span", "loc", t.location + (t.note ? " \u2014 " : "")));
      if (t.note) note.append(t.note);
      body.appendChild(note);
    }
    row.appendChild(body);
    return row;
  }

  // Talent rows are only shown: no checkbox, and a tick saved for one by an
  // older version of the page is ignored.
  const shownOnly = (t) => t.category === "talent";
  const isDone = (t) => !shownOnly(t) && state.done.has(t.id);
  // SKIP rows say what not to buy, so they never hold a level open and are
  // left out of the tallies; the same goes for rows that are only shown.
  // Everything else, INFO included, has to be ticked.
  const counts = (t) => t.priority !== "SKIP" && !shownOnly(t);
  const finished = (groups) => {
    const tasks = groups.flatMap((g) => g.tasks).filter(counts);
    return tasks.length > 0 && tasks.every(isDone);
  };
  // Counts rows hidden for being finished, for the header button.
  let hiddenFinished = 0;

  // A group is { label, sub, tasks, match(level) }. Returns null when the
  // filters leave it empty.
  function buildGroup(g) {
    if (state.level !== "all" && !g.match(state.level)) return null;
    const tasks = g.tasks.filter((t) =>
      (state.category === "all" || t.category === state.category) &&
      !(state.hideDone && isDone(t)));
    if (!tasks.length) return null;

    const counted = g.tasks.filter(counts);
    const done = counted.filter(isDone).length;
    const sec = el("section", "group" + (counted.length && done === counted.length ? " all-done" : ""));
    const h = el("h3");
    h.appendChild(el("span", "lvl", g.label));
    if (g.sub) h.appendChild(el("span", "zone", g.sub));
    if (counted.length) h.appendChild(el("span", "tally", done + " / " + counted.length));
    sec.appendChild(h);
    tasks.forEach((t) => sec.appendChild(renderTask(t)));
    return sec;
  }

  // Route: zones whose level range covers the selected level.
  function routeGroups() {
    return ROUTE.map((z) => {
      const [lo, hi] = range(z.levels);
      return { lo, hi, label: "Lv " + z.levels, sub: z.zone, tasks: z.tasks || [], match: (n) => n >= lo && n <= hi };
    });
  }
  // On level: the selected level and the next one, so the next trainer visit is in view.
  function levelGroups() {
    return LEVELS.map((g) => (
      { level: g.level, label: "Lv " + g.level, tasks: g.tasks || [], match: (n) => g.level === n || g.level === n + 1 }
    ));
  }

  // Said when a column or the whole page has nothing to show.
  function emptyText() {
    if (!me()) return "No character yet.";
    if (ROUTE.length || BASE_LEVELS.length) return "Nothing here with these filters.";
    if (LEVELS.length) return "Only talent rows so far. Pick professions in the Professions tab.";
    return "Nothing to show for this " + raceClass(me()) + " yet. Pick professions in the Professions tab, " +
      "and add a talent build in the Talents tab.";
  }
  function fill(root, sections) {
    root.textContent = "";
    sections.forEach((s) => root.appendChild(s));
    if (!sections.length) root.appendChild(el("div", "empty", emptyText()));
  }

  function band(routeCell, levelCell, cls) {
    const row = el("div", "band" + (cls ? " " + cls : ""));
    const cells = state.swap ? [routeCell, levelCell] : [levelCell, routeCell];
    cells.forEach((c) => row.appendChild(c));
    return row;
  }
  function cell(sections) {
    const c = el("div");
    sections.forEach((s) => c.appendChild(s));
    return c;
  }

  function renderLocked() {
    const root = $("locked");
    root.textContent = "";
    root.appendChild(band(cell([el("h2", null, "In zone")]), cell([el("h2", null, "On level")]), "head"));

    const levels = levelGroups();
    const placed = new Set();
    const bands = [];
    for (const z of routeGroups()) {
      const mine = levels.filter((g) => g.level >= z.lo && g.level <= z.hi && !placed.has(g));
      mine.forEach((g) => placed.add(g));
      bands.push({ at: z.lo, route: [z], levels: mine });
    }
    // Levels no zone covers get a band of their own, in level order.
    levels.filter((g) => !placed.has(g)).forEach((g) => bands.push({ at: g.level, route: [], levels: [g] }));
    bands.sort((x, y) => x.at - y.at);

    let shown = 0;
    for (const b of bands) {
      // A band disappears only once both sides are fully ticked.
      if (!state.showFinished && finished(b.route.concat(b.levels))) {
        if (state.level === "all" || b.route.concat(b.levels).some((g) => g.match(state.level))) hiddenFinished++;
        continue;
      }
      const routeSecs = b.route.map(buildGroup).filter(Boolean);
      const levelSecs = b.levels.map(buildGroup).filter(Boolean);
      if (!routeSecs.length && !levelSecs.length) continue;
      root.appendChild(band(cell(routeSecs), cell(levelSecs)));
      shown++;
    }
    if (!shown) root.appendChild(el("div", "empty", emptyText()));
  }

  function renderTasks() {
    hiddenFinished = 0;
    if (state.lock) {
      renderLocked();
    } else {
      // Unlocked columns are independent, so each group hides by itself.
      const open = (g) => {
        if (state.showFinished || !finished([g])) return true;
        if (state.level === "all" || g.match(state.level)) hiddenFinished++;
        return false;
      };
      fill($("route"), routeGroups().filter(open).map(buildGroup).filter(Boolean));
      fill($("levels"), levelGroups().filter(open).map(buildGroup).filter(Boolean));
    }
    const btn = $("finishedBtn");
    btn.hidden = !state.showFinished && !hiddenFinished;
    btn.setAttribute("aria-pressed", String(state.showFinished));
    btn.textContent = state.showFinished ? "Hide finished levels" : "Show " + hiddenFinished + " finished";
  }

  function renderProgress() {
    const counted = ALL.filter(counts);
    const done = counted.filter(isDone).length;
    $("progressBar").style.width = (counted.length ? (100 * done / counted.length) : 0) + "%";
    $("progressText").textContent = done + " / " + counted.length + " done";
  }

  function renderPanels() {
    // The character's own choices first, then the reference panels, which
    // can be for one class or one race. No character, no tabs.
    const ch = me();
    const panels = !ch ? [] : [{ id: "professions", tab: "Professions" }, { id: "zones", tab: "Zones" }, { id: "talents", tab: "Talents" }]
      .concat((window.PANELS || []).filter((p) => (!p.class || p.class === ch.class) && (!p.race || p.race === ch.race)));
    const rail = $("rail");
    rail.textContent = "";
    for (const p of panels) {
      const b = el("button", null, p.tab || p.id);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.panel === p.id));
      b.addEventListener("click", () => set("panel", state.panel === p.id ? null : p.id));
      rail.appendChild(b);
    }

    const root = $("panel");
    const open = panels.find((p) => p.id === state.panel);
    root.hidden = !open;
    root.textContent = "";
    if (open && open.id === "talents") renderTalentPanel(root);
    if (open && open.id === "professions") renderProfessionPanel(root);
    if (open && open.id === "zones") renderZonePanel(root);
    for (const s of (open && open.sections) || []) {
      const sec = el("section");
      if (s.title) sec.appendChild(el("h3", null, s.title));
      if (s.text) sec.appendChild(el("p", null, s.text));
      if (s.ordered) {
        const ol = el("ol");
        s.ordered.forEach((x) => ol.appendChild(el("li", null, x)));
        sec.appendChild(ol);
      }
      if (s.items) {
        const dl = el("dl");
        s.items.forEach(([k, v]) => { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); });
        sec.appendChild(dl);
      }
      root.appendChild(sec);
    }
  }

  // What is typed into the Talents panel, kept across re-renders.
  const draft = { text: "", name: "", result: null };

  function renderTalentPanel(root) {
    const list = buildList();
    const sec = el("section", "builds");
    sec.appendChild(el("h3", null, "Talent builds"));
    sec.appendChild(el("p", null, "On level shows the selected build's point for each level. Switch builds yourself when you respec. Talent rows are only shown; there is nothing to tick."));
    list.forEach((b, i) => {
      const row = el("label");
      const pick = el("input");
      pick.type = "radio"; pick.name = "build"; pick.checked = i === state.build;
      pick.addEventListener("change", () => chooseBuild(i));
      row.appendChild(pick);
      const text = el("span", "grow", b.name);
      const cached = buildCache.get(b.url.trim());
      const what = el("span", "what");
      text.appendChild(what);
      if (cached) cached.then((r) => { what.textContent = r.error || r.summary; if (r.error) what.className = "what bad"; });
      row.appendChild(text);
      if (!b.fixed) {
        const del = el("button", "btn", "Remove");
        del.type = "button";
        del.addEventListener("click", (e) => {
          e.preventDefault();
          if (!confirm("Remove the build '" + b.name + "'?")) return;
          state.builds.splice(i - (list.length - state.builds.length), 1);
          if (state.build >= i && state.build > 0) state.build--;
          chooseBuild(state.build);
        });
        row.appendChild(del);
      }
      sec.appendChild(row);
    });
    if (!list.length) sec.appendChild(el("p", null, "No builds yet."));
    root.appendChild(sec);

    const add = el("section");
    add.appendChild(el("h3", null, "Add a build"));
    add.appendChild(el("p", null, HOW_TO + " Any class works."));
    const box = el("textarea");
    box.rows = 3; box.placeholder = "https://www.wowhead.com/forever/talent-calc/..."; box.value = draft.text;
    box.setAttribute("aria-label", "Wowhead talent calculator address");
    box.addEventListener("input", () => { draft.text = box.value; draft.result = null; });
    add.appendChild(box);
    const name = el("input");
    name.type = "text"; name.placeholder = "Name, e.g. Affliction to 30"; name.value = draft.name;
    name.setAttribute("aria-label", "Name for this build");
    name.addEventListener("input", () => { draft.name = name.value; });
    add.appendChild(name);
    const check = el("button", "btn", "Check");
    check.type = "button";
    check.addEventListener("click", async () => { draft.result = await readBuild(draft.text); renderPanels(); });
    add.appendChild(check);

    const r = draft.result;
    if (r && r.error) add.appendChild(el("p", "bad", r.error));
    if (r && !r.error) {
      add.appendChild(el("p", "good", r.summary));
      r.notes.forEach((n) => add.appendChild(el("p", "note", n)));
      if (r.notes.length) add.appendChild(el("p", "note", "The calculator does not allow these, so the address may have been edited. You can still add it."));
      const ok = el("button", "btn", "Add and show this build");
      ok.type = "button";
      ok.addEventListener("click", () => {
        state.builds.push({ name: draft.name.trim() || (r.cls.name || r.slug) + " build " + (state.builds.length + 1), url: r.url });
        draft.text = draft.name = ""; draft.result = null;
        chooseBuild(buildList().length - 1);
      });
      add.appendChild(ok);
    }
    root.appendChild(add);
  }

  // A profession's icon from icons/ (never from the web), or a neutral square
  // when the profession has none or the file is missing.
  function profIcon(name) {
    if (!name) return el("span", "picon");
    const img = el("img", "picon");
    img.alt = "";
    img.onerror = () => img.replaceWith(el("span", "picon"));
    img.src = ICON_LOCAL + name + ".jpg";
    return img;
  }

  // A row with a checkbox, for the Professions and Zones panels.
  function tickRow(text, on, onChange, sub, off, zone, icon) {
    const row = el("label", off ? "off" : null);
    if (zone) {
      row.classList.add("zone");
      if (on) row.classList.add("on");
      if (zone.color) row.style.setProperty("--zone", zone.color);
    }
    const box = el("input");
    box.type = "checkbox"; box.checked = on; box.disabled = !!off;
    box.addEventListener("change", () => { row.classList.toggle("on", box.checked); onChange(box.checked); });
    row.appendChild(box);
    if (icon !== undefined) row.appendChild(profIcon(icon));
    const span = el("span", "grow");
    span.appendChild(el("span", "zname", text));
    if (zone && zone.range) {
      const lv = el("span", "zlv", zone.range);
      if (zone.title) lv.title = zone.title;
      span.appendChild(lv);
    }
    if (sub) span.appendChild(el("span", "what", sub));
    row.appendChild(span);
    return row;
  }
  const inList = (list, key, on) => { const at = list.indexOf(key); if (on && at < 0) list.push(key); if (!on && at >= 0) list.splice(at, 1); };
  // The two profession lists, over `mine` (a list of profession keys); used
  // by the Professions panel and by the character dialog.
  function professionPickers(root, mine, onChange, cols) {
    const all = options().professions || [];
    const has = (x) => mine.includes(x.key);
    const rows = (sec, list, full) => {
      for (const x of list) {
        sec.appendChild(tickRow(x.label, has(x), (on) => { inList(mine, x.key, on); onChange(); }, null, full && !has(x), null, x.icon || ""));
      }
    };
    const primary = all.filter(isPrimary), count = primary.filter(has).length;
    const host = cols ? el("div", "twocol") : root;
    if (cols) root.appendChild(host);
    const one = el("section", "builds");
    one.appendChild(el("h3", null, "Primary professions"));
    one.appendChild(el("p", null, "A character has at most " + MAX_PRIMARY + ": " + count + " of " + MAX_PRIMARY + " picked." +
      (count >= MAX_PRIMARY ? " Untick one to pick another." : "")));
    if (count > MAX_PRIMARY) one.appendChild(el("p", "note", "This character has " + count + " primary professions; the game allows " + MAX_PRIMARY + "."));
    rows(one, primary, count >= MAX_PRIMARY);
    host.appendChild(one);

    const two = el("section", "builds");
    two.appendChild(el("h3", null, "Secondary professions"));
    two.appendChild(el("p", null, "A character can have all of them."));
    rows(two, all.filter((x) => !isPrimary(x)), false);
    host.appendChild(two);
  }
  function renderProfessionPanel(root) { professionPickers(root, me().professions, changed, true); }

  // The colour of a zone by its minimum level: WoW's quest difficulty colours,
  // green to red. The scale is these four stops; change them to change the
  // palette. `min` and `max` are the lowest and highest minimum level of the
  // whole zone list, so one level is one colour in every group.
  const ZONE_STOPS = ["#40BF40", "#FFFF00", "#FF8040", "#FF2020"];
  function zoneColor(level, min, max) {
    if (level == null) return null;
    const t = max > min ? Math.min(1, Math.max(0, (level - min) / (max - min))) : 0;
    const at = t * (ZONE_STOPS.length - 1), i = Math.min(ZONE_STOPS.length - 2, Math.floor(at)), f = at - i;
    const rgb = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
    const a = rgb(ZONE_STOPS[i]), b = rgb(ZONE_STOPS[i + 1]);
    return "#" + a.map((v, k) => Math.round(v + (b[k] - v) * f).toString(16).padStart(2, "0")).join("");
  }
  // The zones a race can tick, in groups: one per continent in
  // CHARACTER_OPTIONS.continents, then "Other" for a zone with none. Within a
  // group, by minimum level, then maximum level, then name; a zone with no
  // known range comes last. Continent and level range are data (source/).
  function zoneGroups(race, keepEmpty) {
    const o = options(), info = o.zones || [];
    const mins = info.filter((z) => z.lo != null).map((z) => z.lo);
    const min = Math.min(...mins), max = Math.max(...mins);
    const groups = (o.continents || []).concat("Other").map((name) => ({ name, zones: [] }));
    for (const name of zoneChoices(race)) {
      const z = info.find((x) => x.name === name) || { name }, has = z.lo != null;
      const g = groups.find((x) => x.name === z.continent) || groups[groups.length - 1];
      const classic = z.confidence !== "confirmed";
      g.zones.push({
        name, lo: has ? z.lo : Infinity, hi: has ? z.hi : Infinity, color: has ? zoneColor(z.lo, min, max) : null,
        range: has ? "Lv " + (z.approx ? "~" : "") + z.lo + (z.hi !== z.lo ? "-" + z.hi : "") + (classic ? " (Classic)" : "") : null,
        title: has ? (classic ? "Classic's level range, not confirmed for Forever" : z.approx ? "Forever gives this only roughly (Blizzard: \"mid-30s to mid-40s\")" : "Level range stated for Forever") : null,
      });
    }
    for (const g of groups) g.zones.sort((a, b) => a.lo - b.lo || a.hi - b.hi || a.name.localeCompare(b.name));
    return groups.filter((g) => g.zones.length || (keepEmpty && g.name !== "Other"));
  }
  // The zone checklist, used by the character dialog and the Zones tab.
  // `sub(zone)` is the muted text under a zone's name, if any.
  // With `cols` the continents sit side by side (a continent with no zones for
  // this faction keeps its heading and says "none"), and "Other" goes full
  // width below; otherwise all groups stack.
  function zoneTicks(sec, race, ticked, onTick, sub, cols) {
    const fill = (host, g) => {
      host.appendChild(el("h4", "continent", g.name));
      if (!g.zones.length) host.appendChild(el("div", "none", "none for this faction"));
      for (const z of g.zones) host.appendChild(tickRow(z.name, ticked.includes(z.name), (on) => onTick(z.name, on), sub(z.name), false, z));
    };
    const groups = zoneGroups(race, cols), tied = groups.filter((g) => g.name !== "Other");
    if (!cols) { for (const g of groups) fill(sec, g); return; }
    const row = el("div", "twocol");
    for (const g of tied) { const c = el("div"); fill(c, g); row.appendChild(c); }
    sec.appendChild(row);
    for (const g of groups.filter((x) => x.name === "Other")) { const c = el("div", "fullrow"); fill(c, g); sec.appendChild(c); }
  }

  function renderZonePanel(root) {
    const ch = me(), race = raceOf(ch), all = placesFor(ch);
    const rowsText = (z) => { const n = z.tasks.length; return "Lv " + z.levels + ", " + (n ? n + (n === 1 ? " row" : " rows") : "no rows for this character"); };

    const early = el("section", "builds");
    early.appendChild(el("h3", null, "Zones"));
    early.appendChild(el("p", null, "Tick the zones you level in. A new " + label("races", ch.race) + " starts with its usual ones: " +
      ((race.path || []).join(", then ") || "none written yet") + ". Zones past level " + PATH_MAX_LEVEL + " start unticked; tick the ones you go to."));
    const written = all.filter(onPath);
    zoneTicks(early, race, zonesOf(ch), (zone, on) => {
      if (!ch.zones) ch.zones = zonesOf(ch).slice();
      inList(ch.zones, zone, on);
      changed();
    }, (zone) => {
      const here = written.filter((z) => z.area === zone);
      if (!here.length) return "no rows written yet";
      const n = here.reduce((sum, z) => sum + z.tasks.length, 0);
      return n ? n + (n === 1 ? " row" : " rows") + " for this character" : "no rows for this character";
    });
    root.appendChild(early);

    const late = el("section", "builds");
    late.appendChild(el("h3", null, "Places after level " + PATH_MAX_LEVEL));
    const pick = all.filter((z) => !onPath(z));
    late.appendChild(el("p", null, pick.length ? "Tick the places you go to." : "No In zone rows are written for zones past level " + PATH_MAX_LEVEL + " yet; ticking those zones above only fills the profession trainer lists."));
    for (const z of pick) {
      late.appendChild(tickRow(z.zone, ch.places.includes(z.place), (on) => { inList(ch.places, z.place, on); changed(); }, rowsText(z)));
    }
    root.appendChild(late);
  }

  // ---- character dialog --------------------------------------------------
  // Makes a character in three steps (who it is, by hand or from a Wowhead
  // talent calculator address, which holds the class and the talents but no
  // race; its zones; its professions), or changes the current
  // one's name, class and race. With no character it cannot be closed.
  const STEPS = ["Character", "Zones", "Professions"];
  const form = { edit: false, step: 1, mode: "manual", name: "", race: null, class: null, text: "", result: null, zones: null, professions: [] };

  function openDialog(edit) {
    const ch = edit ? me() : null;
    Object.assign(form, {
      edit: !!ch, step: 1, mode: "manual", text: "", result: null, zones: null, professions: [],
      name: ch ? ch.name : "", race: ch ? ch.race : null, class: ch ? ch.class : null
    });
    renderDialog();
    if (!$("charDialog").open) $("charDialog").showModal();
  }

  // The class the dialog is working with: the picked one, or the one in the
  // pasted address when importing.
  const formClass = () => (!form.edit && form.mode === "import" ? parseAddress(form.text).slug || null : form.class);

  // A column of buttons, one per entry; the picked one is filled in, and
  // clicking it again clears it. `can(x)` says whether x may be picked.
  function pickColumn(title, items, picked, css, can, onPick) {
    const box = el("div");
    box.appendChild(el("h3", null, title));
    for (const x of items) {
      const b = el("button", "pick " + css(x), x.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(x.key === picked));
      b.disabled = !onPick || (x.key !== picked && !can(x));
      if (onPick) b.addEventListener("click", () => { onPick(x.key === picked ? null : x.key); renderDialog(); });
      box.appendChild(b);
    }
    return box;
  }

  // Step 1, and the whole of Edit: name, class and race.
  function stepCharacter(d, first) {
    const importing = !form.edit && form.mode === "import";
    if (first) d.appendChild(el("p", null, "There is no character yet. Make one to see its rows. It is saved in this browser only."));
    if (!form.edit) {
      const modes = el("div", "row");
      for (const [key, text] of [["manual", "Manual"], ["import", "Import from Wowhead"]]) {
        const b = el("button", "chip", text);
        b.type = "button";
        b.setAttribute("aria-pressed", String(form.mode === key));
        b.addEventListener("click", () => { form.mode = key; renderDialog(); });
        modes.appendChild(b);
      }
      d.appendChild(modes);
    }

    const name = el("input");
    name.type = "text"; name.placeholder = "Name (optional)"; name.value = form.name; name.maxLength = 40;
    name.setAttribute("aria-label", "Character name");
    name.addEventListener("input", () => { form.name = name.value; });
    d.appendChild(name);

    if (importing) {
      d.appendChild(el("p", null, "The class and the talents come from the address; it does not hold a race, so pick that below. " + HOW_TO));
      const box = el("textarea");
      box.rows = 3; box.placeholder = "https://www.wowhead.com/forever/talent-calc/..."; box.value = form.text;
      box.setAttribute("aria-label", "Wowhead talent calculator address");
      box.addEventListener("input", () => { form.text = box.value; form.result = null; });
      // The class lists follow the address once the box is left.
      box.addEventListener("change", renderDialog);
      d.appendChild(box);
      const r = form.result;
      if (r && r.error) d.appendChild(el("p", "bad", r.error));
      if (r && !r.error) {
        d.appendChild(el("p", "good", r.summary));
        r.notes.forEach((n) => d.appendChild(el("p", "note", n)));
      }
    } else {
      d.appendChild(el("p", null, "Pick a class and a race, in either order. Picking one greys out what it cannot be paired with; click a picked one again to clear it."));
    }

    // Either list can be picked from first; each one greys out what the
    // other's pick rules out.
    const cls = formClass(), race = form.race && raceByKey(form.race);
    if (race && cls && !form.edit && !(race.classes || []).includes(cls)) form.race = null;
    const races = options().races || [];
    const canRace = (r) => !cls || !r.classes || r.classes.includes(cls);
    const pickRace = (v) => { form.race = v; form.zones = null; };
    const cols = el("div", "pickcols");
    cols.appendChild(pickColumn("Class", options().classes || [], cls, (c) => "cls-" + c.key,
      (c) => !form.race || !raceByKey(form.race).classes || raceByKey(form.race).classes.includes(c.key),
      importing ? null : (v) => { form.class = v; }));
    for (const [faction, title] of [["horde", "Horde"], ["alliance", "Alliance"]]) {
      cols.appendChild(pickColumn(title, races.filter((r) => r.faction === faction), form.race, (r) => "fac-" + r.faction, canRace, pickRace));
    }
    d.appendChild(cols);
  }

  // Step 2: the zones for levels 1-PATH_MAX_LEVEL, the race's usual ones ticked.
  function stepZones(d) {
    const race = raceByKey(form.race);
    const sec = el("section", "builds");
    sec.appendChild(el("h3", null, "Zones"));
    sec.appendChild(el("p", null, "In zone shows rows for the zones ticked here (written for levels 1-" + PATH_MAX_LEVEL + " only so far), and profession trainers are listed for them. The usual ones for " + race.label +
      " are ticked; zones past level " + PATH_MAX_LEVEL + " are yours to tick. You can change them later in the Zones tab."));
    const written = new Set((window.ROUTE_DATA || []).filter(onPath).map((z) => z.area));
    zoneTicks(sec, race, form.zones, (zone, on) => inList(form.zones, zone, on), (zone) => (written.has(zone) ? null : "no rows written yet"), true);
    d.appendChild(sec);
  }

  // Step 3: professions, with why the page asks.
  function stepProfessions(d) {
    d.appendChild(el("p", null, "Professions decide many rows. Crafting ranks need a character level as well as skill " +
      "(Journeyman: skill 50 and level 10; Expert: skill 125 and level 20), and the camp items come from Cooking, Fishing, " +
      "Skinning and Herbalism. The page puts each on the level or in the zone where it comes up. " +
      "You can change them later in the Professions tab."));
    professionPickers(d, form.professions, renderDialog, true);
  }

  function renderDialog() {
    const d = $("charDialog"), first = !state.characters.length;
    d.textContent = "";
    d.appendChild(el("h2", null, form.edit ? "Edit character" : "New character"));
    if (!form.edit) d.appendChild(el("p", "steps", "Step " + form.step + " of " + STEPS.length + ": " + STEPS[form.step - 1]));
    if (form.edit || form.step === 1) stepCharacter(d, first);
    else if (form.step === 2) stepZones(d);
    else stepProfessions(d);

    const buttons = el("div", "row buttons");
    const button = (text, onClick, cls, off) => {
      const b = el("button", "btn" + (cls ? " " + cls : ""), text);
      b.type = "button"; b.disabled = !!off;
      b.addEventListener("click", onClick);
      buttons.appendChild(b);
    };
    const importing = !form.edit && form.mode === "import";
    const ready = !!form.race && (importing ? !!form.text.trim() : !!form.class);
    if (form.edit) button("Save", saveCharacter, "main", !ready);
    else {
      if (form.step === 1 && importing) button("Check", async () => { form.result = await readBuild(form.text); renderDialog(); });
      if (form.step > 1) button("Back", () => { form.step--; renderDialog(); });
      if (form.step < STEPS.length) button("Next", nextStep, "main", !ready && !importing);
      else button("Create", createCharacter, "main");
    }
    if (!first) button("Cancel", () => d.close());
    if (form.edit) {
      buttons.appendChild(el("span", "spacer"));
      button("Remove", removeCharacter);
    }
    d.appendChild(buttons);
  }

  // Leaving step 1 checks the pasted address, when there is one.
  async function nextStep() {
    if (form.step === 1) {
      if (form.mode === "import") {
        let r = await readBuild(form.text);
        if (!r.error && !(options().classes || []).some((x) => x.key === r.slug)) r = { error: "This page does not offer the " + r.slug + " class yet." };
        if (!r.error && !racesFor(r.slug).some((x) => x.key === form.race)) r = { error: "Pick a race that can be a " + label("classes", r.slug) + "." };
        form.result = r;
        if (r.error) { renderDialog(); return; }
      }
      if (!form.zones) form.zones = (raceByKey(form.race).path || []).slice();
    }
    form.step++;
    renderDialog();
  }

  function createCharacter() {
    const first = !state.characters.length;
    const raw = { name: form.name.trim(), race: form.race, class: form.class, professions: form.professions.slice(), places: [], zones: form.zones.slice() };
    if (form.mode === "import") {
      const r = form.result;
      raw.class = r.slug;
      raw.builds = [{ name: (r.cls.name || r.slug) + " build", url: r.url }];
    }
    state.characters.push(readCharacter(raw));
    state.character = state.characters.length - 1;
    // The pasted build is the last on the list, after the page's own example.
    me().build = Math.max(0, buildList().length - 1);
    $("charDialog").close();
    saveState();
    // A first visit ends with the tour of the page.
    applyCharacter().then(() => { render(); if (first) startTour(); });
  }
  function saveCharacter() {
    // A new race brings its own usual zones.
    if (form.race !== me().race) me().zones = null;
    Object.assign(me(), { name: form.name.trim().slice(0, 40), race: form.race, class: form.class });
    $("charDialog").close();
    changed();
  }
  function removeCharacter() {
    const c = me();
    if (!confirm("Remove '" + charName(c) + "' and its " + c.done.size + " ticks?")) return;
    state.characters.splice(state.character, 1);
    state.character = Math.max(0, state.character - 1);
    $("charDialog").close();
    changed();
  }

  // ---- tour ---------------------------------------------------------------
  // A click-through over the loaded page: one ring and one card per part.
  // Shown after a first visit's character is made, and again from "?".
  const narrow = () => window.matchMedia("(max-width: 760px)").matches;
  // A column's box. Locked, the two columns are the halves of one scroller.
  function columnBox(which) {
    if (!state.lock) return $(which + "Col").getBoundingClientRect();
    const r = $("locked").getBoundingClientRect();
    if (narrow()) return r;
    const left = (which === "level") !== state.swap;
    return { left: left ? r.left : r.left + r.width / 2, top: r.top, width: r.width / 2, height: r.height };
  }
  const boxOf = (node) => node.getBoundingClientRect();
  const TOUR = [
    { title: "On level", at: () => columnBox("level"),
      text: "What to do when you reach each level: what to train and what to skip, profession ranks, and your talent point. Tick a row when it is done. A level goes away once everything in it is ticked." },
    { title: "In zone", at: () => columnBox("route"),
      text: "What to do while you are in a zone, whatever your level there: gathering, fishing, camp items, quests tied to your class or professions. Only the zones you ticked show, and only when they have rows for this character. It is not a quest route." },
    { title: "Level and Type", at: () => boxOf($("levelAll").parentNode),
      text: "Step Level to where you are and both columns narrow to that level and the next one. Type shows one kind of row. Finished levels and done tasks can be brought back from the right." },
    { title: "Edge tabs", at: () => boxOf($("rail")),
      text: "Professions, Zones and Talents hold this character's choices; paste a Wowhead talent address under Talents to get a talent row per level. The tabs after them are reference notes. A tab opens a panel over the page; click it again to close." },
    { title: "Characters and saving", at: () => boxOf($("charSelect").parentNode),
      text: "Switch, edit or add characters on the left. Lock scroll ties the two columns together and Swap flips them. Everything is saved in this browser only: use Export and Import to move it. The ? button shows this tour again." }
  ];
  let tourAt = -1;
  function startTour() {
    if (!me()) return;
    if (state.panel) { state.panel = null; render(); }
    tourAt = 0;
    $("tour").hidden = false;
    renderTour();
  }
  function endTour() { tourAt = -1; $("tour").hidden = true; }
  function renderTour() {
    if (tourAt < 0) return;
    const step = TOUR[tourAt], card = $("tourCard"), ring = $("tourRing");
    card.textContent = "";
    card.appendChild(el("p", "count", (tourAt + 1) + " of " + TOUR.length));
    card.appendChild(el("h2", null, step.title));
    card.appendChild(el("p", null, step.text));
    const buttons = el("div", "row");
    const button = (text, onClick, cls) => {
      const b = el("button", "btn" + (cls ? " " + cls : ""), text);
      b.type = "button";
      b.addEventListener("click", onClick);
      buttons.appendChild(b);
      return b;
    };
    const last = tourAt === TOUR.length - 1;
    if (tourAt > 0) button("Back", () => { tourAt--; renderTour(); });
    const next = button(last ? "Done" : "Next", () => { if (last) endTour(); else { tourAt++; renderTour(); } }, "main");
    buttons.appendChild(el("span", "spacer"));
    if (!last) button("Skip", endTour);
    card.appendChild(buttons);

    // The ring, kept inside the window; then the card: inside a big box,
    // else under it, else beside it.
    const W = window.innerWidth, H = window.innerHeight, pad = 4, r = step.at();
    const top = Math.max(pad, r.top), left = Math.max(pad, r.left);
    const box = { top, left, width: Math.min(W - pad, r.left + r.width) - left, height: Math.min(H - pad, r.top + r.height) - top };
    for (const k of ["top", "left", "width", "height"]) ring.style[k] = box[k] + "px";
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let x, y;
    if (box.height > ch + 40 && box.width > cw + 40) { x = box.left + (box.width - cw) / 2; y = box.top + 40; }
    else if (H - (box.top + box.height) > ch + 16) { x = box.left; y = box.top + box.height + 10; }
    else { x = box.left - cw - 10; y = box.top + 10; }
    card.style.left = Math.max(12, Math.min(W - cw - 12, x)) + "px";
    card.style.top = Math.max(12, Math.min(H - ch - 12, y)) + "px";
    next.focus();
  }

  function renderHeader() {
    const sel = $("charSelect");
    sel.textContent = "";
    state.characters.forEach((c, i) => {
      const opt = el("option", null, c.name ? c.name + " (" + raceClass(c) + ")" : raceClass(c));
      opt.value = i; opt.selected = i === state.character;
      sel.appendChild(opt);
    });
    sel.hidden = $("charEdit").hidden = $("tourBtn").hidden = !state.characters.length;
    document.title = (me() ? charName(me()) + " · " : "") + "WoW Forever";
  }

  function render() {
    renderHeader(); renderFilters(); renderTasks(); renderProgress(); renderPanels();
    if (!me() && !$("charDialog").open) openDialog(false);
  }

  // ---- actions -----------------------------------------------------------
  function set(key, value) { state[key] = value; saveState(); render(); }
  function toggle(id, on) {
    if (on) state.done.add(id); else state.done.delete(id);
    saveState();
    render();
  }
  // The current character was edited: pick its rows again.
  function changed() {
    saveState();
    applyCharacter().then(render);
  }
  function chooseCharacter(i) {
    state.character = i;
    changed();
  }
  function chooseBuild(i) {
    state.build = i;
    saveState();
    applyBuild().then(render);
  }
  function stepLevel(delta) {
    const from = state.level === "all" ? (delta > 0 ? 0 : MAX_LEVEL + 1) : state.level;
    set("level", Math.min(MAX_LEVEL, Math.max(1, from + delta)));
  }

  function exportProgress() {
    const payload = Object.assign({ app: "forever-lvl", version: 2, exported: new Date().toISOString() }, serialize());
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = el("a");
    a.href = url;
    a.download = "forever-lvl-progress-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function importProgress(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(reader.result);
        if (raw && Array.isArray(raw.characters) && raw.characters.length) {
          if (!confirm("Replace every character here with the " + raw.characters.length + " in this file?")) return;
          applyState(raw);
        } else if (raw && Array.isArray(raw.done) && !me()) {
          // A file from before characters, and nobody here: it becomes the
          // character it was written for.
          applyState(raw, true);
        } else if (raw && Array.isArray(raw.done)) {
          // A file from before characters: one character's progress.
          if (!confirm("Replace the progress of '" + charName(me()) + "' with " + raw.done.length + " completed tasks from this file?")) return;
          const from = readCharacter(raw);
          Object.assign(me(), { done: from.done, level: from.level, builds: from.builds, build: from.build });
        } else {
          throw new Error("no characters and no 'done' list in file");
        }
        changed();
      } catch (e) {
        alert("Could not import: " + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ---- boot --------------------------------------------------------------
  $("charSelect").addEventListener("change", (e) => chooseCharacter(Number(e.target.value)));
  $("charEdit").addEventListener("click", () => openDialog(true));
  $("charNew").addEventListener("click", () => openDialog(false));
  $("tourBtn").addEventListener("click", startTour);
  window.addEventListener("resize", renderTour);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tourAt >= 0) endTour(); });
  // Escape closes the dialog only when there is a character to go back to.
  $("charDialog").addEventListener("cancel", (e) => { if (!me()) e.preventDefault(); });
  $("charDialog").addEventListener("close", () => { if (!me()) openDialog(false); });
  $("levelAll").addEventListener("click", () => set("level", "all"));
  $("levelDown").addEventListener("click", () => stepLevel(-1));
  $("levelUp").addEventListener("click", () => stepLevel(1));
  $("hideDone").addEventListener("change", (e) => set("hideDone", e.target.checked));
  $("finishedBtn").addEventListener("click", () => set("showFinished", !state.showFinished));
  $("lockBtn").addEventListener("click", () => set("lock", !state.lock));
  $("swapBtn").addEventListener("click", () => set("swap", !state.swap));
  $("exportBtn").addEventListener("click", exportProgress);
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    if (e.target.files[0]) importProgress(e.target.files[0]);
    e.target.value = "";
  });
  $("resetBtn").addEventListener("click", () => {
    if (!state.done.size || !confirm("Clear all " + state.done.size + " completed tasks?")) return;
    state.done.clear();
    saveState();
    render();
  });

  // The data comes first: reading saved state needs the list of classes,
  // races and professions.
  loadData().then(() => {
    loadState();
    // A saved filter may name a category that is gone.
    if (state.category !== "all" && !CATEGORIES[state.category]) state.category = "all";
    return applyCharacter();
  }).then(render).catch((e) => {
    $("route").appendChild(el("div", "error", e.message + "\nCheck data/index.js and the data/ folder."));
  });
})();
</script>
</body>
</html>
